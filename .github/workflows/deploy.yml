name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger redeploy on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "37.27.195.174 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKXVlR+D/5z9ZQNl1AeJbskaJfTYvdTTtVNHxaexuAVx" > ~/.ssh/known_hosts
          # The server restricts this key to a forced command (redeploy script only),
          # so the actual command we pass here is ignored server-side.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes maryan@37.27.195.174 true
